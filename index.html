<style>
  /* LAYOUT: dark-chocolate single-page storefront. Announcement bar > sticky nav > hero with chocolate drip >
     category rail > Instagram mosaic > menu grid > about collage > reviews > WhatsApp banner > footer. */
  :root {
    --bg: #120905;          /* deepest cocoa, page ground */
    --bg-alt: #170c06;      /* alternate band */
    --panel: #1d0f08;       /* cards and rails */
    --line: rgba(217,160,91,.18);
    --caramel: #d9a05b;
    --caramel-light: #f0c98a;
    --cream: #f7ead8;
    --cream-dim: #cdb89c;
    --ink: #2a140b;         /* text on caramel buttons */
    --font-script: 'Allura', cursive;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Jost', system-ui, sans-serif;
    color-scheme: dark;
  }

  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* paints the strip above the sticky nav on phones with a notch */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 60; background: #150a05;
  }
  section[id] { scroll-margin-top: 84px; }
  :focus-visible { outline: 2px solid var(--caramel-light); outline-offset: 3px; }
  ::selection { background: var(--caramel); color: var(--ink); }

  .gutter {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .script { font-family: var(--font-script); font-weight: 400; line-height: 1.05; }
  .eyebrow {
    font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--caramel);
    font-weight: 500;
  }
  .section-title {
    font-family: var(--font-script); font-size: clamp(2.6rem, 6vw, 4rem); line-height: 1.05;
    color: var(--cream); text-wrap: balance;
  }
  .hairline { height: 1px; background: linear-gradient(90deg, var(--line), transparent); flex: 1; min-width: 24px; }

  /* buttons */
  .btn-gold, .btn-ghost {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
    font-weight: 600; letter-spacing: .01em; border-radius: 999px; overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
    text-decoration: none; cursor: pointer; border: 0; font-family: inherit;
  }
  .btn-gold {
    background: linear-gradient(135deg, #f6d9a6 0%, #e0a95e 55%, #c88a43 100%);
    color: var(--ink); box-shadow: 0 8px 24px -8px rgba(217,160,91,.55), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .btn-gold::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-120%) skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    transition: transform .7s ease;
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -8px rgba(217,160,91,.7), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn-gold:hover::after { transform: translateX(120%) skewX(-20deg); }
  .btn-gold:active { transform: translateY(0); }
  .btn-ghost {
    background: rgba(247,234,216,.04); color: var(--cream); border: 1px solid rgba(240,201,138,.45);
  }
  .btn-ghost:hover { background: rgba(240,201,138,.12); border-color: var(--caramel-light); transform: translateY(-2px); }

  /* chocolate drip hanging from the nav */
  .drip {
    position: absolute; inset: 0 0 auto 0; height: 100px; z-index: 1; pointer-events: none;
    background-repeat: repeat-x; background-size: 360px 100px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='100' viewBox='0 0 360 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%232a140b'/><stop offset='1' stop-color='%234a2815'/></linearGradient></defs><g fill='url(%23g)'><rect width='360' height='24'/><rect x='30' width='22' height='62' rx='11'/><rect x='118' width='28' height='96' rx='14'/><rect x='204' width='18' height='44' rx='9'/><rect x='282' width='26' height='78' rx='13'/></g><g fill='white' fill-opacity='.12'><rect x='36' y='8' width='4' height='38' rx='2'/><rect x='126' y='8' width='5' height='70' rx='2.5'/><rect x='209' y='8' width='3' height='24' rx='1.5'/><rect x='290' y='8' width='5' height='56' rx='2.5'/></g></svg>");
  }
  .hero {
    background:
      radial-gradient(55% 65% at 76% 42%, rgba(217,160,91,.24), transparent 70%),
      radial-gradient(40% 50% at 6% 92%, rgba(130,64,26,.38), transparent 70%),
      linear-gradient(180deg, #1c0f08 0%, #120905 100%);
  }
  .hero-img {
    -webkit-mask-image: radial-gradient(ellipse 62% 60% at 50% 50%, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 62% 60% at 50% 50%, #000 62%, transparent 100%);
    animation: floaty 7s ease-in-out infinite;
  }

  /* cards */
  .card {
    background: linear-gradient(180deg, #2a170d 0%, #1d0f08 100%);
    border: 1px solid var(--line);
    transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
  }
  .card:hover {
    transform: translateY(-6px); border-color: rgba(240,201,138,.6);
    box-shadow: 0 22px 44px -18px rgba(0,0,0,.8), 0 0 0 1px rgba(240,201,138,.12), 0 18px 60px -24px rgba(217,160,91,.45);
  }
  .badge {
    position: absolute; top: 10px; right: 10px; z-index: 2; padding: 3px 10px; border-radius: 999px;
    background: linear-gradient(135deg, #f6d9a6, #d9a05b); color: var(--ink);
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
  }
  .chip {
    border: 1px solid var(--line); color: var(--cream-dim); background: rgba(247,234,216,.03);
    padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all .25s ease; white-space: nowrap; font-family: inherit;
  }
  .chip:hover { color: var(--cream); border-color: rgba(240,201,138,.55); }
  .chip[aria-pressed="true"] {
    background: linear-gradient(135deg, #f6d9a6, #d9a05b); color: var(--ink); border-color: transparent;
  }

  /* navigation */
  .nav-link { position: relative; padding: 6px 2px; font-size: 15px; color: var(--cream-dim); transition: color .2s ease; text-decoration: none; }
  .nav-link::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; border-radius: 2px;
    background: var(--caramel); transform: scaleX(0); transform-origin: left; transition: transform .3s ease;
  }
  .nav-link:hover, .nav-link[aria-current="true"] { color: var(--cream); }
  .nav-link:hover::after, .nav-link[aria-current="true"]::after { transform: scaleX(1); }

  /* categories */
  .cat-btn { background: none; border: 0; cursor: pointer; font-family: inherit; color: inherit; }
  .cat-ring {
    border-radius: 999px; padding: 3px; background: linear-gradient(135deg, #f0c98a, #8a4f22 60%, #d9a05b);
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .cat-btn:hover .cat-ring, .cat-btn[aria-pressed="true"] .cat-ring {
    transform: translateY(-4px) scale(1.05); box-shadow: 0 14px 28px -10px rgba(217,160,91,.6);
  }
  .cat-btn[aria-pressed="true"] span.cat-name { color: var(--caramel-light); }
  .hide-scroll { scrollbar-width: none; }
  .hide-scroll::-webkit-scrollbar { display: none; }

  /* gallery */
  .tile img { transition: transform .7s ease; }
  .tile:hover img { transform: scale(1.1); }
  .tile .veil { opacity: 0; transition: opacity .3s ease; }
  .tile:hover .veil, .tile:focus-visible .veil { opacity: 1; }

  /* announcement marquee (phones) */
  .marquee-track { display: flex; width: max-content; animation: marquee 22s linear infinite; }

  /* floating whatsapp */
  .fab {
    position: fixed; z-index: 50;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center;
    background: linear-gradient(135deg, #f6d9a6, #d9a05b 60%, #c88a43); color: var(--ink);
    box-shadow: 0 12px 30px -6px rgba(0,0,0,.7), 0 0 0 6px rgba(217,160,91,.16);
    transition: transform .25s ease;
  }
  .fab:hover { transform: scale(1.08) rotate(-4deg); }
  .fab::before {
    content: ""; position: absolute; inset: 0; border-radius: 999px; border: 2px solid var(--caramel-light);
    animation: ping 2.6s ease-out infinite;
  }

  .lift { transition: transform .35s ease; }
  .lift:hover { transform: translateY(-4px); }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .rise-2 { animation-delay: .12s; } .rise-3 { animation-delay: .24s; } .rise-4 { animation-delay: .36s; }

  @keyframes marquee { to { transform: translateX(-50%); } }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-12px) rotate(.8deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%,100% { transform: scale(1.5); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* Mobile storefront: clean editorial bakery layout */
  .category-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .category-card { position:relative; min-width:0; aspect-ratio:1/1; overflow:hidden; border:1px solid rgba(217,160,91,.3); border-radius:16px; background:#26150d; color:var(--cream); }
  .category-card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .45s ease; }
  .category-card::after { content:""; position:absolute; inset:38% 0 0; background:linear-gradient(transparent,rgba(12,6,3,.86)); }
  .category-card span { position:absolute; z-index:1; left:4px; right:4px; bottom:10px; text-align:center; font-weight:600; font-size:clamp(11px,3vw,15px); text-shadow:0 2px 6px #000; }
  .category-card[aria-pressed="true"] { outline:2px solid var(--caramel-light); outline-offset:2px; }
  .mobile-bottom-nav { display:none; }

  @media (max-width: 640px) {
    body { padding-bottom:calc(64px + env(safe-area-inset-bottom,0px)); }
    header > div { min-height:62px; padding-top:7px !important; padding-bottom:7px !important; }
    header a[aria-label="Smuff Bakers home"] { gap:9px !important; min-width:0; }
    header a[aria-label="Smuff Bakers home"] img { width:40px !important; height:40px !important; }
    header a[aria-label="Smuff Bakers home"] span { font-size:18px !important; white-space:nowrap; }
    header .btn-gold { display:none !important; }
    header a[aria-label="Visit Smuff Bakers on Instagram"] { width:38px; height:38px; flex-shrink:0; }
    header .btn-gold svg { width:16px; height:16px; }
    header button[aria-label="Open menu"], header button[aria-label="Close menu"] { width:38px !important; height:38px !important; flex-shrink:0; }
    .gutter { padding-left:16px; padding-right:16px; }

    .hero { background:
      radial-gradient(75% 42% at 50% 22%, rgba(217,160,91,.2), transparent 75%),
      linear-gradient(180deg,#211108 0%,#120905 100%); }
    .hero .gutter {
      display:grid; grid-template-columns:minmax(0,1fr);
      grid-template-areas:"art" "copy"; gap:0;
      padding-top:22px; padding-bottom:30px;
    }
    .hero-art { grid-area:art; width:100%; max-width:440px; margin:0 auto; }
    .hero-img {
      display:block; width:100%; height:clamp(220px,68vw,300px); max-height:none;
      object-fit:contain; object-position:center; animation:none;
      -webkit-mask-image:radial-gradient(ellipse 76% 72% at 50% 50%,#000 70%,transparent 100%);
      mask-image:radial-gradient(ellipse 76% 72% at 50% 50%,#000 70%,transparent 100%);
    }
    .hero-art > div { inset:14% !important; }
    .hero-art > p { display:none; }
    .hero-copy { grid-area:copy; text-align:center; padding:0 2px; }
    .hero .eyebrow { font-size:9px; letter-spacing:.2em; }
    .hero .hero-copy h1 { font-size:clamp(2.65rem,12vw,3.6rem); line-height:.95; margin-top:8px; }
    .hero .hero-copy h1 svg { width:22px; height:22px; }
    .hero .hero-copy > p:nth-of-type(2) { font-size:21px; line-height:1.15; margin-top:8px; }
    .hero .hero-copy > p:nth-of-type(3) {
      display:block; max-width:390px; margin:10px auto 0;
      font-size:13px; line-height:1.55; color:var(--cream-dim);
    }
    .hero .hero-copy > div:last-child {
      display:grid; grid-template-columns:1fr 1fr; gap:9px;
      margin:18px auto 0; max-width:420px;
    }
    .hero .hero-copy > div:last-child a {
      min-height:44px; padding:10px 8px; font-size:11px;
      white-space:normal; line-height:1.25;
    }
    .drip { height:52px; opacity:.55; }

    section[aria-label="Categories"] { padding-top:4px; padding-bottom:28px; }
    section[aria-label="Categories"] .mb-5 { margin-bottom:16px; gap:9px; }
    .section-title { font-size:2.55rem; }
    .category-grid { gap:9px; }
    .category-card { aspect-ratio:1/1.08; border-radius:13px; }
    .category-card span { font-size:11px; bottom:8px; }

    #menu { padding-top:38px; padding-bottom:42px; }
    #menu .mt-8.grid { gap:10px; }
    #menu article { border-radius:14px; }
    #menu article .relative.aspect-\[4\/3\] { aspect-ratio:1/1; }
    #menu article .flex.flex-1 { padding:10px; gap:8px; }
    #menu article h3 { font-size:15px; }
    #menu article p.font-display { font-size:18px; }
    #menu article a { font-size:10px; padding:9px 5px; gap:4px; white-space:normal; line-height:1.2; }
    #gallery { padding-top:40px; padding-bottom:40px; }

    .mobile-bottom-nav {
      position:fixed; z-index:70; inset:auto 0 0; display:grid;
      grid-template-columns:repeat(5,1fr);
      padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));
      background:rgba(13,6,3,.97); border-top:1px solid rgba(217,160,91,.28);
      backdrop-filter:blur(14px);
    }
    .mobile-bottom-nav a {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:3px; color:var(--cream-dim); text-decoration:none; font-size:10px; line-height:1.2;
    }
    .mobile-bottom-nav a:nth-child(3) { color:var(--caramel-light); }
    .fab { right:14px; bottom:calc(76px + env(safe-area-inset-bottom,0px)); width:46px; height:46px; }
  }
</style>

            <li className="flex items-center gap-3"><span className="text-caramel"><${Icon} name="whatsapp" size=${20} /></span><a href=${generalLink()} target="_blank" rel="noopener" className="hover:text-caramel-light">${CONFIG.phoneDisplay}</a></li>
            <li className="flex items-center gap-3"><span className="text-caramel"><${Icon} name="instagram" size=${20} /></span><a href=${CONFIG.instagram} target="_blank" rel="noopener" className="hover:text-caramel-light">@smuff.pk</a></li>
            <li className="flex items-center gap-3"><span className="text-caramel"><${Icon} name="truck" size=${20} /></span>Free delivery all over Pakistan</li>
          </ul>
        </div>
        <div>
          <h3 className="font-display text-xl font-semibold text-cream">Follow Us</h3>
          <div className="mt-3 flex gap-3">
            ${[['instagram', CONFIG.instagram, 'Instagram'], ['facebook', CONFIG.facebook, 'Facebook'], ['tiktok', CONFIG.tiktok, 'TikTok']].map(([ic, href, label]) => html`<a key=${label} href=${href} target="_blank" rel="noopener" aria-label=${label} className="lift grid h-11 w-11 place-items-center rounded-full border border-caramel/40 text-caramel-light hover:bg-caramel/15"><${Icon} name=${ic} size=${20} /></a>`)}
          </div>
        </div>
      </div>
      <div className="border-t border-caramel/10">
        <div className="gutter mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-2 py-5 text-sm text-cream-dim">
          <span>© ${new Date().getFullYear()} Smuff Bakers. All rights reserved.</span>
          <span className="flex items-center gap-1.5">Made with <${Icon} name="heart" size=${15} className="text-caramel" /> in Pakistan</span>
        </div>
      </div>
    </footer>`;
  }

  function App() {
    const [filter, setFilter] = useState('All');
    const active = useScrollSpy(['home', 'menu', 'about', 'reviews', 'contact']);
    const pickCategory = (name) => {
      setFilter(name);
      const el = document.getElementById('menu');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    return html`<div>
      <${Announcement} />
      <${Navbar} active=${active} />
      <main>
        <${Hero} />
        <${Categories} filter=${filter} onPick=${pickCategory} />
        <${Menu} filter=${filter} setFilter=${setFilter} />
        <${Gallery} />
        <${About} />
        <${Reviews} />
        <${CTA} />
      </main>
      <${Footer} />
      <nav className="mobile-bottom-nav" aria-label="Mobile navigation">
        <a href="#home" onClick=${(e) => scrollToId(e, "home")}><${Icon} name="heart" size=${20} /><span>Home</span></a>
        <a href="#menu" onClick=${(e) => scrollToId(e, "menu")}><${Icon} name="menu" size=${20} /><span>Menu</span></a>
        <a href=${generalLink()} target="_blank" rel="noopener"><${Icon} name="whatsapp" size=${22} /><span>Order</span></a>
        <a href="#reviews" onClick=${(e) => scrollToId(e, "reviews")}><${Icon} name="star" size=${20} /><span>Reviews</span></a>
        <a href="#contact" onClick=${(e) => scrollToId(e, "contact")}><${Icon} name="truck" size=${20} /><span>Contact</span></a>
      </nav>
      <a href=${generalLink()} target="_blank" rel="noopener" className="fab" aria-label="Order on WhatsApp"><${Icon} name="whatsapp" size=${28} /></a>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
